name: NodeX WASM CI

on:
  pull_request:
    paths:
      - "wasm/**"
      - "frontend/src/lib/wallet/wasm.ts"
      - "frontend/src/lib/wallet/wasm/**"
      - ".github/workflows/nodex-wasm-ci.yml"
  push:
    branches:
      - main
    paths:
      - "wasm/**"
      - "frontend/src/lib/wallet/wasm.ts"
      - "frontend/src/lib/wallet/wasm/**"
      - ".github/workflows/nodex-wasm-ci.yml"

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "wasm -> target"
      - name: Test portable WASM crate on host
        run: cargo test --manifest-path wasm/Cargo.toml
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser WASM package
        run: wasm-pack build wasm --target web --out-dir ../frontend/src/lib/wasm/pkg
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend against generated WASM package
        working-directory: frontend
        run: npm run typecheck
