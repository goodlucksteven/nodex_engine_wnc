services:
  - type: web
    name: nodex-wallet-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3030"
      - key: RUST_LOG
        value: info
      - key: NODEX_ENGINE_API_KEY
        sync: false

  - type: web
    name: sable-wallet-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: |
      npm install
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      rustup target add wasm32-unknown-unknown
      cargo install wasm-pack --locked
      wasm-pack build ../wasm --target web --out-dir ../frontend/src/lib/wallet/wasm/pkg
      npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODEX_ENGINE_URL
        sync: false
      - key: VITE_NODEX_ENGINE_URL
        sync: false
      - key: NODEX_ENGINE_API_KEY
        sync: false
